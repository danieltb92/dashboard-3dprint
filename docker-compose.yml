services:
  api:
    build: ./api
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:///./sql_app.db

  web:
    build: ./web
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - .env
    depends_on:
      - api

  db-backup:
    image: linuxserver/rclone:latest
    container_name: db-backup
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/London
      - CRON_SCHEDULE=0 3 * * *
    volumes:
      - ./api/sql_app.db:/data/db.sqlite:ro
      - ./config/rclone:/config/rclone
      - ./scripts:/scripts
    command: /scripts/backup.sh
